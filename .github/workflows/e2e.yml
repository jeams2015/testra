name: E2E Tests

# Corre la suite de tests E2E — on-demand o al abrir un PR hacia main.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec específico a correr (vacío = toda la suite)"
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "adapters/**"
      - "core/**"
      - "demo-app/src/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install demo-app dependencies
        run: npm ci --prefix demo-app

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run E2E tests
        env:
          CI: "true"
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            npx playwright test "${{ github.event.inputs.spec }}"
          else
            npx playwright test tests/features/
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
